name: Check the ledger

# Runs on every pull request, so the ledger's guarantees are a build status
# rather than something a reviewer has to remember to check.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node build.mjs
